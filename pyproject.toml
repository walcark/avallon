[project]
name = "avallon"
version = "0.1.0.dev0"
description = "A personal note site backed by a git repository of Markdown"
readme = "README.md"
requires-python = ">= 3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "walcark", email = "kevin.walcarius@gmail.com"}]
keywords = ["notes", "markdown", "wiki", "django", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "django>=6.0,<7",
    "django-markdownify",
    "python-frontmatter",
    "pymdown-extensions>=11,<12",
    "pygments>=2.20,<3",
    "uvicorn[standard]",
    "python-docx>=1.2,<2",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/walcark/avallon"
Source = "https://github.com/walcark/avallon"

[project.scripts]
avallon = "avallon.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
# One top-level name, `avallon`, so the wheel claims nothing it does not own.
packages = ["src/avallon"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
avallon = { path = ".", editable = true }
django-markdownify = "*"
python-frontmatter = "*"
uvicorn = { version = "*", extras = ["standard"] }

[tool.pixi.tasks]
manage = "python manage.py"
makemigrations = "python manage.py makemigrations"
migrate = "python manage.py migrate"
runserver = "python manage.py runserver"
# ASGI server: required for the live-reload SSE stream to actually stream
# (the WSGI runserver buffers async responses instead of streaming them).
serve = "uvicorn avallon.settings.asgi:application --reload --reload-dir src --reload-include '*.html' --reload-include '*.css' --host 127.0.0.1 --port 8000"
# Fill any missing date/updated in content frontmatter (from git dates / mtime).
stamp = "python -m avallon.notes.stamp --backfill"
# Content location (notes + taxonomy.toml), stored in ~/.config/mysite/.
content-where = "python -m avallon.notes.repo where"        # print active dir
content-init = "python -m avallon.notes.repo init"          # create/adopt <path>
content-set = "python -m avallon.notes.repo set"            # activate <path>
# Sync the content repo: pull (rebase), commit, push if an origin exists.
# Consecutive edits fold into one commit for 15 min (MYSITE_SYNC_WINDOW).
sync = "python -m avallon.notes.sync"
# Scaffold a new page (interactive: domaine/type from taxonomy.toml, free tags).
new = "python -m avallon.notes.scaffold"
# Re-file a page under another domaine/type (its directory moves; slug kept).
move = "python -m avallon.notes.move"
# Export a note to Word (.docx) or PDF, styled by a reference document.
export = "python manage.py export"
# Rebuild the demo company reference document used by `export`.
make-reference = "python scripts/make_reference_docx.py"
# Extend the taxonomy vocabulary (edits taxonomy.toml and commits it).
add-domain = "python -m avallon.notes.taxonomy add-domain"
add-type = "python -m avallon.notes.taxonomy add-type"
# Verify every existing page sits under a declared domaine/type.
check-taxo = "python -m avallon.notes.taxonomy check"

[tool.pixi.dependencies]
django = ">=6.0.6,<7"
pygments = ">=2.20,<3"
pymdown-extensions = ">=11,<12"
# Fuzzy picker for `pixi run new` (domaine/type). Pinned here so the command
# uses the project's own fzf, not one leaking from another env's PATH.
fzf = "*"
pandoc = ">=3.10.1,<4"
python-docx = ">=1.2.0,<2"

# Development tooling, in its own environment so that installing it never
# rebuilds the environment the site runs on.
[tool.pixi.feature.dev.dependencies]
ruff = "*"
mypy = ">=1.5"
pytest = "*"
pytest-cov = ">=6.0"
pytest-django = "*"

[tool.pixi.feature.dev.tasks]
fmt = "ruff format ."
fmt-check = "ruff format --check ."
lint = "ruff check src scripts tests"
type-check = "mypy src scripts"
test = "pytest -q --cov=avallon --cov-report=term-missing --cov-report=xml"
all = { depends-on = ["fmt", "lint", "type-check", "test"] }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".pixi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["avallon"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
exclude = "^(\\.pixi|scripts/make_reference_docx\\.py)$"

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "avallon.settings.settings"
pythonpath = ["src"]
addopts = "--import-mode=importlib"
