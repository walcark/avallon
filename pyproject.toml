[project]
authors = [{name = "walcark", email = "kevin.walcarius@cnes.fr"}]
dependencies = []
name = "mysite"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
# This layout has no single package named after the project: src/ is the
# import root and holds several top-level packages (config, pages, ...).
# Ship all of src/ and strip the prefix so they import by their bare name
# (import config / import pages).
only-include = ["src"]
sources = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
mysite = { path = ".", editable = true }
django-markdownify = "*"
python-frontmatter = "*"
uvicorn = { version = "*", extras = ["standard"] }

[tool.pixi.tasks]
manage = "python manage.py"
makemigrations = "python manage.py makemigrations"
migrate = "python manage.py migrate"
runserver = "python manage.py runserver"
# ASGI server: required for the live-reload SSE stream to actually stream
# (the WSGI runserver buffers async responses instead of streaming them).
serve = { cmd = "uvicorn config.asgi:application --reload --reload-include '*.html' --reload-include '*.css' --host 127.0.0.1 --port 8000", cwd = "src" }
# Fill any missing date/updated in content frontmatter (from git dates / mtime).
stamp = "python scripts/stamp_dates.py --backfill"
# Content location (notes + taxonomy.toml), stored in ~/.config/mysite/.
content-where = "python scripts/content_repo.py where"        # print active dir
content-init = "python scripts/content_repo.py init"          # create/adopt <path>
content-set = "python scripts/content_repo.py set"            # activate <path>
# Sync the content repo: pull (rebase), commit, push if an origin exists.
# Consecutive edits fold into one commit for 15 min (MYSITE_SYNC_WINDOW).
sync = "python scripts/sync.py"
# Scaffold a new page (interactive: domaine/type from taxonomy.toml, free tags).
new = "python scripts/new_page.py"
# Re-file a page under another domaine/type (its directory moves; slug kept).
move = "python scripts/move_page.py"
# Export a note to Word (.docx) or PDF, styled by a reference document.
export = "python manage.py export"
# Rebuild the demo company reference document used by `export`.
make-reference = "python scripts/make_reference_docx.py"
# Extend the taxonomy vocabulary (edits taxonomy.toml and commits it).
add-domain = "python scripts/taxonomy.py add-domain"
add-type = "python scripts/taxonomy.py add-type"
# Verify every existing page sits under a declared domaine/type.
check-taxo = "python scripts/taxonomy.py check"

[tool.pixi.dependencies]
django = ">=6.0.6,<7"
pygments = ">=2.20,<3"
pymdown-extensions = ">=11,<12"
# Fuzzy picker for `pixi run new` (domaine/type). Pinned here so the command
# uses the project's own fzf, not one leaking from another env's PATH.
fzf = "*"
pandoc = ">=3.10.1,<4"
python-docx = ">=1.2.0,<2"

# Development tooling, in its own environment so that installing it never
# rebuilds the environment the site runs on.
[tool.pixi.feature.dev.dependencies]
ruff = "*"
mypy = ">=1.5"
pytest = "*"
pytest-cov = ">=6.0"
pytest-django = "*"

[tool.pixi.feature.dev.tasks]
fmt = "ruff format ."
fmt-check = "ruff format --check ."
lint = "ruff check src scripts tests"
type-check = "mypy src scripts"
test = "pytest -q --cov=pages --cov=scripts --cov-report=term-missing --cov-report=xml"
all = { depends-on = ["fmt", "lint", "type-check", "test"] }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".pixi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["pages", "config"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
# scripts/ is put on sys.path at runtime (see config.settings), so it is a
# source root here too rather than a package to import through its folder.
mypy_path = "src:scripts"
exclude = "^(\\.pixi|scripts/make_reference_docx\\.py)$"

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src", "scripts"]
addopts = "--import-mode=importlib"
