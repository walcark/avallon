[project]
authors = [{name = "walcark", email = "kevin.walcarius@cnes.fr"}]
dependencies = []
name = "kevin-website"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
# This layout has no single package named after the project: src/ is the
# import root and holds several top-level packages (config, pages, ...).
# Ship all of src/ and strip the prefix so they import by their bare name
# (import config / import pages).
only-include = ["src"]
sources = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
kevin_website = { path = ".", editable = true }
django-markdownify = "*"
python-frontmatter = "*"
uvicorn = { version = "*", extras = ["standard"] }

[tool.pixi.tasks]
manage = "python manage.py"
makemigrations = "python manage.py makemigrations"
migrate = "python manage.py migrate"
runserver = "python manage.py runserver"
# ASGI server: required for the live-reload SSE stream to actually stream
# (the WSGI runserver buffers async responses instead of streaming them).
serve = { cmd = "uvicorn config.asgi:application --reload --reload-include '*.html' --reload-include '*.css' --host 127.0.0.1 --port 8000", cwd = "src" }
# Fill any missing date/updated in content frontmatter (from git dates / mtime).
stamp = "python scripts/stamp_dates.py --backfill"
# Content location (notes + taxonomy.toml), stored in ~/.config/kevin-website/.
content-where = "python scripts/content_repo.py where"        # print active dir
content-init = "python scripts/content_repo.py init"          # create/adopt <path>
content-set = "python scripts/content_repo.py set"            # activate <path>
# Scaffold a new page (interactive: domaine/type from taxonomy.toml, free tags).
new = "python scripts/new_page.py"
# Extend the taxonomy vocabulary (edits taxonomy.toml and commits it).
add-domain = "python scripts/taxonomy.py add-domain"
add-type = "python scripts/taxonomy.py add-type"
# Verify every existing page sits under a declared domaine/type.
check-taxo = "python scripts/taxonomy.py check"

[tool.pixi.dependencies]
django = ">=6.0.6,<7"
pygments = ">=2.20,<3"
pymdown-extensions = ">=11,<12"
# Fuzzy picker for `pixi run new` (domaine/type). Pinned here so the command
# uses the project's own fzf, not one leaking from another env's PATH.
fzf = "*"
