[project]
name = "avallon"
version = "0.2.0"
description = "A personal note site backed by a git repository of Markdown"
readme = "README.md"
requires-python = ">= 3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "walcark", email = "kevin.walcarius@gmail.com"}]
keywords = ["notes", "markdown", "wiki", "django", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "django>=6.0,<7",
    "django-markdownify",
    "python-frontmatter",
    "pymdown-extensions>=11,<12",
    "pygments>=2.20,<3",
    "uvicorn[standard]",
    "python-docx>=1.2,<2",
    "pyyaml",
    "whitenoise",
]

[project.urls]
Homepage = "https://github.com/walcark/avallon"
Source = "https://github.com/walcark/avallon"

[project.scripts]
avallon = "avallon.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
# One top-level name, `avallon`, so the wheel claims nothing it does not own.
packages = ["src/avallon"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
avallon = { path = ".", editable = true }
django-markdownify = "*"
python-frontmatter = "*"
whitenoise = "*"
uvicorn = { version = "*", extras = ["standard"] }

[tool.pixi.tasks]
manage = "python manage.py"
makemigrations = "python manage.py makemigrations"
migrate = "python manage.py migrate"
runserver = "python manage.py runserver"
# The tasks are aliases of the shipped command, so what is used here and what
# a user gets from `pip install avallon` are the same code path.
serve = "avallon serve --reload"
stamp = "avallon stamp --backfill"
repo = "avallon repo"          # print or switch the active notes repository
init = "avallon init"          # create/adopt <path|url> and activate it
sync = "avallon sync"
new = "avallon new"
move = "avallon move"
export = "avallon export"
add-domain = "avallon add-domain"
add-type = "avallon add-type"
check = "avallon check"
# Rebuild the demo company reference document used by `export`.
make-reference = "python scripts/make_reference_docx.py"

[tool.pixi.dependencies]
django = ">=6.0.6,<7"
pygments = ">=2.20,<3"
pymdown-extensions = ">=11,<12"
# Fuzzy picker for `pixi run new` (domaine/type). Pinned here so the command
# uses the project's own fzf, not one leaking from another env's PATH.
fzf = "*"
pandoc = ">=3.10.1,<4"
python-docx = ">=1.2.0,<2"

# Development tooling, in its own environment so that installing it never
# rebuilds the environment the site runs on.
[tool.pixi.feature.dev.dependencies]
ruff = "*"
mypy = ">=1.5"
pytest = "*"
pytest-cov = ">=6.0"
pytest-django = "*"

[tool.pixi.feature.dev.tasks]
fmt = "ruff format ."
fmt-check = "ruff format --check ."
lint = "ruff check src scripts tests"
type-check = "mypy src scripts"
# The notes directory is resolved when Django imports the settings, which
# pytest-django does *before* any conftest runs. It therefore has to come from
# the environment: a throwaway path, since every test rebinds it to its own
# tree through the `notes` fixture.
test = { cmd = "pytest -q --cov=avallon --cov-report=term-missing --cov-report=xml", env = { AVALLON_CONTENT_DIR = "/tmp/avallon-tests-notes" } }
all = { depends-on = ["fmt", "lint", "type-check", "test"] }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".pixi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["avallon"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
exclude = "^(\\.pixi|scripts/make_reference_docx\\.py)$"

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "avallon.settings.settings"
pythonpath = ["src"]
addopts = "--import-mode=importlib"
