{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accueil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'pages/css/style.css' %}">
</head>
<body>
    <main class="prose">
        <h1>Contenu</h1>

        {% if pages %}
        <ul class="page-index">
            {% for p in pages %}
            <li>
                <a href="{{ p.url }}">{{ p.title }}</a>
                <span class="meta">{{ p.domain }} / {{ p.type }}{% for t in p.tags %} · {{ t }}{% endfor %}</span>
                {% if p.summary %}<p class="summary">{{ p.summary }}</p>{% endif %}
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p>Aucune page pour l'instant.</p>
        {% endif %}
    </main>
</body>
</html>
