{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'pages/css/pygments.css' %}">
    <link rel="stylesheet" href="{% static 'pages/css/style.css' %}">

    <!-- MathJax: renders the \(...\) / \[...\] emitted by arithmatex -->
    <script>
      window.MathJax = {
        tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
        options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
    <div class="toolbar">
        <nav class="breadcrumb" aria-label="Fil d'Ariane">
            <a href="/">Accueil</a>
            <span class="sep">/</span>
            <a href="/?domaine={{ page.domain|urlencode }}">{{ page.domain }}</a>
            <span class="sep">/</span>
            <a href="/?type={{ page.type|urlencode }}">{{ page.type }}</a>
            <span class="sep">/</span>
            <span class="current" aria-current="page">{{ page.title }}</span>
        </nav>
        <button type="button" class="width-toggle" data-width="narrow" title="Basculer la largeur">
            Largeur&nbsp;: <span class="width-label">normale</span>
        </button>
    </div>

    <main class="prose">
        {{ content_html|safe }}
    </main>

    <script>
      // Width toggle (narrow reading column <-> full width), persisted.
      (function () {
        const main = document.querySelector('.prose');
        const btn = document.querySelector('.width-toggle');
        const label = btn.querySelector('.width-label');
        const KEY = 'prose-width';

        function apply(mode) {
          const wide = mode === 'wide';
          main.classList.toggle('is-wide', wide);
          btn.dataset.width = mode;
          label.textContent = wide ? 'pleine' : 'normale';
        }

        apply(localStorage.getItem(KEY) || 'narrow');

        btn.addEventListener('click', function () {
          const next = btn.dataset.width === 'wide' ? 'narrow' : 'wide';
          localStorage.setItem(KEY, next);
          apply(next);
        });
      })();
    </script>

    <script>
      // Live reload: subscribe to the SSE stream and swap the rendered HTML
      // into .prose in place whenever the .md file changes on disk. Replacing
      // only innerHTML keeps the scroll position and the width-toggle state.
      (function () {
        const main = document.querySelector('.prose');
        const es = new EventSource('/stream/?path=' + encodeURIComponent('{{ relpath }}'));

        es.addEventListener('update', function (e) {
          main.innerHTML = JSON.parse(e.data);
          // Re-typeset math in the freshly injected fragment (if MathJax is up).
          if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise([main]);
          }
        });
      })();
    </script>
</body>
</html>
