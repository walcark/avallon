{% extends "base.html" %}
{% load static %}

{% block title %}{{ page.title }}{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{% static 'pages/css/pygments.css' %}">

    <!-- MathJax (self-hosted SVG build): renders the \(...\) / \[...\] emitted
         by arithmatex. SVG output embeds glyph paths, so no external font files
         are fetched — the whole thing works offline. -->
    <script>
      window.MathJax = {
        tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
        options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
      };
    </script>
    <script src="{% static 'pages/js/mathjax/tex-mml-svg.js' %}" async></script>
{% endblock %}

{% block topbar %}{{ page.domain }} / {{ page.type }}{% endblock %}

{% block content %}
    <main class="prose">
        {{ content_html|safe }}
    </main>
{% endblock %}

{% block scripts %}
    <script>
      // Live reload: subscribe to the SSE stream and swap the rendered HTML
      // into .prose in place whenever the .md file changes on disk. Replacing
      // only innerHTML keeps the scroll position and the sidebar/theme state.
      (function () {
        const main = document.querySelector('.prose');
        const es = new EventSource('/stream/?path=' + encodeURIComponent('{{ relpath }}'));
        es.addEventListener('update', function (e) {
          main.innerHTML = JSON.parse(e.data);
          if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise([main]);
          }
        });
      })();
    </script>
{% endblock %}
