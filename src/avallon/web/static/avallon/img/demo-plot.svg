<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Roboto, sans-serif">
  <rect width="480" height="300" fill="#ffffff"/>
  <!-- axes -->
  <line x1="60" y1="250" x2="450" y2="250" stroke="#57606a" stroke-width="1.5"/>
  <line x1="60" y1="30"  x2="60"  y2="250" stroke="#57606a" stroke-width="1.5"/>
  <!-- gridlines -->
  <g stroke="#e3e5e8" stroke-width="1">
    <line x1="60" y1="200" x2="450" y2="200"/>
    <line x1="60" y1="150" x2="450" y2="150"/>
    <line x1="60" y1="100" x2="450" y2="100"/>
    <line x1="60" y1="50"  x2="450" y2="50"/>
  </g>
  <!-- curve y = sin-ish -->
  <path d="M60,230 C140,40 200,40 250,140 S360,250 450,70" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- points -->
  <g fill="#dc2626">
    <circle cx="60"  cy="230" r="4"/>
    <circle cx="155" cy="70"  r="4"/>
    <circle cx="250" cy="140" r="4"/>
    <circle cx="350" cy="200" r="4"/>
    <circle cx="450" cy="70"  r="4"/>
  </g>
  <!-- labels -->
  <text x="255" y="285" text-anchor="middle" fill="#57606a" font-size="13">x</text>
  <text x="25"  y="145" text-anchor="middle" fill="#57606a" font-size="13" transform="rotate(-90 25 145)">f(x)</text>
</svg>
