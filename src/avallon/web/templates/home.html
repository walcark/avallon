{% extends "base.html" %}
{% load lang %}

{% block title %}{{ "Home"|t }}{% endblock %}
{% block topbar %}{{ "Home"|t }}{% endblock %}

{% block content %}
    <main class="home">
        <h1>{{ "Contents"|t }}</h1>

        <input type="search" class="search" id="q" value="{{ query }}"
               placeholder="{{ "Search the notes…"|t }}" autocomplete="off"
               aria-label="{{ "Search the notes…"|t }}">

        <!-- Facets, count and results. Replaced wholesale as the selection
             narrows, by the very fragment the server rendered here. -->
        <div id="explorer">{% include "_explorer.html" %}</div>
    </main>
{% endblock %}

{% block scripts %}
    <script>
      (function () {
        const input = document.getElementById('q');
        const explorer = document.getElementById('explorer');

        // The URL is the selection: every interaction edits it, the server
        // answers with the fragment, and the address bar keeps saying what is
        // on screen. No second filtering implementation lives here.
        function params() {
          return new URLSearchParams(location.search);
        }

        let pending = null;
        function apply(next) {
          const qs = next.toString();
          const url = qs ? '?' + qs : location.pathname;
          history.replaceState(null, '', url);
          if (pending) pending.abort();
          pending = new AbortController();
          fetch('/search/?' + qs, { signal: pending.signal })
            .then(r => r.text())
            .then(html => { explorer.innerHTML = html; })
            .catch(() => {});
        }

        let timer = null;
        input.addEventListener('input', function () {
          clearTimeout(timer);
          timer = setTimeout(function () {
            const next = params();
            const value = input.value.trim();
            value ? next.set('q', value) : next.delete('q');
            apply(next);
          }, 180);
        });

        // Delegated: the fragment is replaced on every change, so listeners
        // bound to its children would die with the first one.
        explorer.addEventListener('click', function (e) {
          const chip = e.target.closest('.chip');
          if (!chip) return;
          const next = params();

          if (chip.dataset.view) {
            next.set('view', chip.dataset.view);
            apply(next);
            return;
          }

          const param = chip.dataset.param;
          const value = chip.dataset.value;
          const current = next.getAll(param);
          const wasActive = current.includes(value);
          next.delete(param);

          if (param === 'tag') {
            // Tags accumulate: they answer "about what?", and asking about two
            // subjects at once is a legitimate question.
            current.filter(v => v !== value).forEach(v => next.append(param, v));
            if (!wasActive) next.append(param, value);
          } else if (!wasActive) {
            // Everything else is single-valued: clicking another domain moves
            // there rather than adding to it. Clicking the active one clears it.
            next.append(param, value);
          }

          // A view guessed for images makes no sense once the selection
          // changes: let the server guess again.
          next.delete('view');
          apply(next);
        });
      })();
    </script>
{% endblock %}
